[project]
name = "repairlib"
description = "Multi-user repair-shop application with web, API, CLI and MCP adapters"
license = "MIT"
version = "0.0.0"
requires-python = ">=3.13"
# Minimums are the versions in Debian 13 (trixie) and Alpine; the app runs on the
# distribution packages alone, with no pip, venv or uv at runtime.
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "argon2-cffi>=21.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "playwright==1.65.2",
]

[tool.uv]
package = false
